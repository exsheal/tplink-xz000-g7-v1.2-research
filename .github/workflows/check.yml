name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public files and links
        run: python3 .github/scripts/check_public.py .
      - name: Check offline tools
        run: python3 -m unittest discover -s tests -v
